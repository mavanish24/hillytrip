<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="taxiSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="suvYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#taxiSky)"/>
  <!-- Mountain Road Curves -->
  <polygon points="50,380 350,180 600,380" fill="#475569"/>
  <polygon points="400,380 700,120 1000,380" fill="#64748b"/>
  <!-- Winding Hill Road -->
  <path d="M0,520 Q400,440 700,560 T1200,490 L1200,675 L0,675 Z" fill="#1e293b"/>
  <path d="M0,590 Q400,510 700,630 T1200,560" stroke="#facc15" stroke-width="8" stroke-dasharray="24,18" fill="none"/>
  <!-- Mountain 4x4 Bolero / Innova Taxi Silhouette -->
  <g transform="translate(480, 390)">
    <!-- Roof Carrier with Luggage -->
    <rect x="40" y="40" width="160" height="8" fill="#475569"/>
    <rect x="50" y="25" width="45" height="15" fill="#3b82f6" rx="2"/>
    <rect x="100" y="20" width="55" height="20" fill="#ef4444" rx="2"/>
    <rect x="160" y="28" width="35" height="12" fill="#22c55e" rx="2"/>
    <!-- Cab Body -->
    <path d="M30,80 L70,45 L180,45 L220,75 L240,85 L240,120 L20,120 L20,85 Z" fill="url(#suvYellow)" stroke="#a16207" stroke-width="3"/>
    <!-- Windows -->
    <polygon points="75,52 120,52 120,78 60,78" fill="#0f172a"/>
    <polygon points="128,52 175,52 205,78 128,78" fill="#0f172a"/>
    <!-- Wheels & Suspension -->
    <circle cx="65" cy="125" r="22" fill="#0f172a" stroke="#94a3b8" stroke-width="6"/>
    <circle cx="195" cy="125" r="22" fill="#0f172a" stroke="#94a3b8" stroke-width="6"/>
    <!-- Headlight Beam -->
    <polygon points="240,90 400,60 420,140 240,110" fill="#fef08a" opacity="0.25"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="snowPeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="peakShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="midRidge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="forestRidge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle cx="950" cy="380" r="90" fill="#fef08a" opacity="0.6"/>
  <!-- Far Mountain Peaks (Kanchenjunga) -->
  <polygon points="150,420 380,180 520,380" fill="url(#snowPeak)"/>
  <polygon points="380,180 520,380 430,420" fill="url(#peakShadow)" opacity="0.7"/>
  <polygon points="420,400 650,130 820,400" fill="url(#snowPeak)"/>
  <polygon points="650,130 820,400 720,420" fill="url(#peakShadow)" opacity="0.75"/>
  <polygon points="750,420 920,220 1080,450" fill="url(#snowPeak)"/>
  <!-- Mid range ridges -->
  <path d="M0,380 Q250,330 500,420 T1000,390 T1200,420 L1200,675 L0,675 Z" fill="url(#midRidge)" opacity="0.9"/>
  <!-- Mist layer -->
  <path d="M0,450 Q300,420 600,460 T1200,440 L1200,520 L0,520 Z" fill="#ffffff" opacity="0.18"/>
  <!-- Pine Foreground Ridge -->
  <path d="M0,500 Q350,470 700,530 T1200,510 L1200,675 L0,675 Z" fill="url(#forestRidge)"/>
  <!-- Pine Tree Silhouettes -->
  <g fill="#022c22">
    <polygon points="120,530 140,460 160,530"/>
    <polygon points="180,540 200,480 220,540"/>
    <polygon points="250,550 270,470 290,550"/>
    <polygon points="400,560 420,490 440,560"/>
    <polygon points="450,570 470,500 490,570"/>
    <polygon points="780,550 800,480 820,550"/>
    <polygon points="850,540 870,460 890,540"/>
    <polygon points="920,550 940,490 960,550"/>
    <polygon points="1020,560 1040,470 1060,560"/>
  </g>
</svg>

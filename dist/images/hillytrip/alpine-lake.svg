<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="lakeSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="lakePeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#lakeSky)"/>
  <!-- Mountain reflections backdrop -->
  <polygon points="100,340 320,160 520,340" fill="url(#lakePeak)"/>
  <polygon points="400,340 650,110 880,340" fill="url(#lakePeak)"/>
  <polygon points="760,340 980,180 1150,340" fill="url(#lakePeak)"/>
  <!-- Shoreline rocks -->
  <path d="M0,320 Q300,300 600,330 T1200,310 L1200,360 L0,360 Z" fill="#475569"/>
  <!-- Alpine Lake Water -->
  <rect y="350" width="1200" height="325" fill="url(#waterGrad)"/>
  <!-- Water ripples and prayer flag reflections -->
  <ellipse cx="600" cy="400" rx="300" ry="12" fill="#38bdf8" opacity="0.3"/>
  <ellipse cx="450" cy="460" rx="220" ry="10" fill="#38bdf8" opacity="0.25"/>
  <ellipse cx="750" cy="520" rx="260" ry="14" fill="#7dd3fc" opacity="0.2"/>
  <ellipse cx="600" cy="590" rx="340" ry="16" fill="#e0f2fe" opacity="0.15"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="fogSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#fogSky)"/>
  <!-- Distant misty pines (Layer 1) -->
  <g fill="#475569" opacity="0.4">
    <polygon points="100,500 120,280 140,500"/>
    <polygon points="200,520 225,240 250,520"/>
    <polygon points="340,490 360,260 380,490"/>
    <polygon points="500,530 525,220 550,530"/>
    <polygon points="680,510 700,270 720,510"/>
    <polygon points="840,490 865,250 890,490"/>
    <polygon points="1000,520 1020,290 1040,520"/>
  </g>
  <!-- Mist layer 1 -->
  <rect y="380" width="1200" height="120" fill="#f1f5f9" opacity="0.45"/>
  <!-- Mid pines (Layer 2) -->
  <g fill="#1e293b" opacity="0.75">
    <polygon points="60,600 90,200 120,600"/>
    <polygon points="280,620 310,180 340,620"/>
    <polygon points="440,600 470,160 500,600"/>
    <polygon points="620,610 650,190 680,610"/>
    <polygon points="780,590 810,150 840,590"/>
    <polygon points="940,620 970,210 1000,620"/>
    <polygon points="1100,600 1130,170 1160,600"/>
  </g>
  <!-- Heavy Mountain Fog -->
  <path d="M0,460 Q300,410 600,470 T1200,430 L1200,580 L0,580 Z" fill="#ffffff" opacity="0.4"/>
  <!-- Foreground Forest Path (Layer 3) -->
  <polygon points="0,675 450,520 750,520 1200,675" fill="#0f172a"/>
  <polygon points="350,675 560,520 640,520 850,675" fill="#334155" opacity="0.8"/>
  <!-- Silhouette pine trunks up close -->
  <polygon points="10,675 40,80 70,675" fill="#020617"/>
  <polygon points="1120,675 1150,60 1180,675" fill="#020617"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="forestSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="pandaFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <!-- Singalila / Neora Valley Forest Canopy -->
  <rect width="1200" height="675" fill="url(#forestSky)"/>
  <!-- Mossy Pine & Bamboo Branches -->
  <path d="M0,280 Q400,240 800,320 T1200,290" stroke="#065f46" stroke-width="36" fill="none"/>
  <path d="M0,450 Q500,410 1000,480 T1200,440" stroke="#78350f" stroke-width="48" fill="none"/>
  <!-- Red Panda on Branch -->
  <!-- Tail with distinctive rings -->
  <path d="M420,440 Q340,490 310,560" stroke="url(#pandaFur)" stroke-width="32" stroke-linecap="round" fill="none"/>
  <path d="M400,450 Q350,490 320,550" stroke="#7c2d12" stroke-width="8" stroke-dasharray="14,14" fill="none"/>
  <!-- Body -->
  <ellipse cx="500" cy="420" rx="75" ry="50" fill="url(#pandaFur)"/>
  <circle cx="560" cy="380" r="42" fill="url(#pandaFur)"/>
  <!-- Ears -->
  <polygon points="545,345 565,315 580,345" fill="#ffffff"/>
  <polygon points="550,345 565,325 575,345" fill="#ea580c"/>
  <polygon points="575,350 595,320 610,350" fill="#ffffff"/>
  <!-- Face Markings -->
  <circle cx="575" cy="380" r="5" fill="#18181b"/>
  <circle cx="550" cy="380" r="5" fill="#18181b"/>
  <ellipse cx="562" cy="392" rx="6" ry="4" fill="#18181b"/>
  <path d="M545,395 Q562,405 580,395" stroke="#ffffff" stroke-width="4" fill="none"/>
  <!-- Lush Green Leaves -->
  <circle cx="850" cy="380" r="90" fill="#047857" opacity="0.8"/>
  <circle cx="950" cy="340" r="110" fill="#065f46" opacity="0.85"/>
  <circle cx="1080" cy="400" r="120" fill="#064e3b"/>
</svg>
